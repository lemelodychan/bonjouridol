name: Crawl news and Twitter sources

on:
  schedule:
    # Runs every 6 hours — crawl window is dynamic: only items published since the last crawl
    - cron: '0 */6 * * *'
  workflow_dispatch:
    # Can also be triggered manually from GitHub.com → Actions tab

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 — Fetch new content from sources
        run: |
          BODY=$(jq -n \
            --arg run_id     "${{ github.run_id }}" \
            --argjson run_number ${{ github.run_number }} \
            --arg repo       "${{ github.repository }}" \
            '{github_run_id: $run_id, github_run_number: $run_number, github_repo: $repo}')

          http_code=$(curl -s --show-error \
            -o /tmp/fetch_response.json \
            -w "%{http_code}" \
            -X POST \
            "${{ secrets.APP_URL }}/api/admin/curation/crawl/fetch" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            -d "$BODY" \
            --max-time 55)

          response=$(cat /tmp/fetch_response.json 2>/dev/null || echo '{}')
          echo "HTTP $http_code — $response"

          if [ "$http_code" -ge 400 ]; then
            echo "Fetch endpoint returned HTTP $http_code"
            exit 1
          fi

          error=$(echo "$response" | jq -r '.error // empty' 2>/dev/null)
          if [ -n "$error" ]; then
            echo "Fetch endpoint returned error: $error"
            exit 1
          fi

      - name: Step 2 — Process new items with AI (loops until all raw items are classified)
        run: |
          BODY=$(jq -n \
            --arg run_id     "${{ github.run_id }}" \
            --argjson run_number ${{ github.run_number }} \
            --arg repo       "${{ github.repository }}" \
            '{github_run_id: $run_id, github_run_number: $run_number, github_repo: $repo}')

          max_iterations=20
          for i in $(seq 1 $max_iterations); do
            http_code=$(curl -s --show-error \
              -o /tmp/process_response.json \
              -w "%{http_code}" \
              -X POST \
              "${{ secrets.APP_URL }}/api/admin/curation/crawl/process" \
              -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
              -H "Content-Type: application/json" \
              -d "$BODY" \
              --max-time 28)

            response=$(cat /tmp/process_response.json 2>/dev/null || echo '{}')
            echo "Batch $i — HTTP $http_code — $response"

            if [ "$http_code" -ge 400 ]; then
              echo "Process endpoint returned HTTP $http_code"
              exit 1
            fi

            error=$(echo "$response" | jq -r '.error // empty' 2>/dev/null)
            if [ -n "$error" ]; then
              echo "Process endpoint returned error: $error"
              exit 1
            fi

            processed=$(echo "$response" | jq -r '.processed // 0' 2>/dev/null || echo "0")
            if [ "$processed" -le "0" ]; then
              echo "No more items to process."
              break
            fi

            sleep 1
          done
