name: Crawl news and Twitter sources

on:
  schedule:
    # Runs every 3 hours
    - cron: '0 */3 * * *'
  workflow_dispatch:
    # Can also be triggered manually from GitHub.com → Actions tab
    # Useful for testing or forcing a crawl outside the schedule

jobs:
  crawl:
    runs-on: ubuntu-latest
    steps:
      - name: Step 1 — Fetch new content from sources
        run: |
          curl -X POST "${{ secrets.APP_URL }}/api/admin/curation/crawl/fetch" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --fail \
            --max-time 25 \
            --silent \
            --show-error

      - name: Step 2 — Process new items with AI
        run: |
          curl -X POST "${{ secrets.APP_URL }}/api/admin/curation/crawl/process" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -H "Content-Type: application/json" \
            --max-time 25 \
            --silent \
            --show-error
        # Note: Step 2 returns 503 until Phase 3 is complete.
        # We intentionally do NOT use --fail here so the workflow
        # still passes while the AI pipeline is being built.
