name: Prismic Content Backup

on:
  schedule:
    # Run monthly on the 1st day at 10 AM JST (1 AM UTC)
    - cron: '0 1 1 * *'
  workflow_dispatch:
    # Allow manual trigger
  push:
    branches:
      - main
    paths:
      - 'scripts/backup-prismic.js'
      - 'package.json'

jobs:
  backup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0
          ref: main
        
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'
          cache: 'npm'
          
      - name: Install dependencies
        run: npm ci
        
      - name: Create backups directory
        run: mkdir -p backups
        
      - name: Run Prismic backup
        env:
          PRISMIC_ACCESS_TOKEN: ${{ secrets.PRISMIC_ACCESS_TOKEN }}
          REPO_NAME: ${{ secrets.REPO_NAME }}
        run: node scripts/backup-prismic.js
        
      - name: Check for backup files
        run: |
          echo "Backup files created:"
          ls -la backups/

      - name: Prune old backups (keep latest 5)
        run: |
          cd backups
          # Filenames embed ISO timestamps, so reverse-sort by name = newest first
          ls -1 prismic-backup-*.zip 2>/dev/null | sort -r | tail -n +6 | while read -r f; do
            echo "Removing old backup: $f"
            rm -f -- "$f"
          done
          echo "Remaining backups:"
          ls -1 prismic-backup-*.zip 2>/dev/null || echo "(none)"

      - name: Commit and push backup files
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"

          # Stage adds and deletes so pruned backups are removed in the same commit
          git add -A backups/
          
          # Check if there are changes to commit
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🤖 Automated Prismic backup - $(date -u +'%Y-%m-%d %H:%M:%S UTC')"
            
            # Force push to avoid conflicts (since we're only adding backup files)
            git push origin main --force-with-lease
          fi
          
      - name: Upload backup as artifact (for debugging)
        uses: actions/upload-artifact@v4
        with:
          name: prismic-backup-${{ github.run_number }}
          path: backups/
          retention-days: 7
